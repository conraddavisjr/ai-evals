<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stardust Cafe Floor Plan</title>
<meta name="description" content="The same architecture drawn as districts of the cafe, in the dusk palette of the 3D scene: storefront, back office, the floor, the staff, the pass, the roster, the inspector’s desk, the cellar and the house rules." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
html, body { height: 100%; margin: 0; overflow: hidden; } body { background: var(--bg); }
/* Shared structure for both treatments. Colors and type come from the theme file. */
.archv,
.archv * {
  box-sizing: border-box;
}
.archv {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
  overflow: hidden;
}
.archv .bar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--bar);
  flex-wrap: wrap;
}
.archv .bar .title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: var(--display-weight);
  letter-spacing: 0.01em;
  color: var(--title);
  margin: 0;
}
.archv .bar .sub {
  color: var(--muted);
  font-size: 12.5px;
}
.archv .bar .spacer {
  flex: 1;
}
.archv .bar button {
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
}
.archv .bar button:hover {
  border-color: var(--accent);
}
.archv .bar button:focus-visible,
.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.archv .bar input {
  font: inherit;
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  min-width: 180px;
}
.archv .bar .zoom {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 44px;
  text-align: center;
}
.archv .bar .status {
  color: var(--muted);
  font-size: 12.5px;
  max-width: 40vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.archv .legend {
  display: flex;
  gap: 10px 14px;
  flex-wrap: wrap;
  padding: 6px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bar);
  font-size: 12px;
  color: var(--muted);
}
.archv .legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.archv .legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
  border: 1px dashed var(--seg-line);
}
.archv-canvas {
  flex: 1;
  min-height: 0;
  position: relative;
  background: var(--canvas);
}
.archv-svg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
.archv-svg.grabbing {
  cursor: grabbing;
}
.archv .seg-box {
  fill: var(--seg-fill);
  stroke: var(--seg-line);
  stroke-width: 2;
  stroke-dasharray: 10 8;
}
.archv .seg-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--font-display);
  pointer-events: none;
}
.archv .seg-name {
  font-size: 22px;
  font-weight: var(--display-weight);
  color: var(--seg-title);
  background: var(--canvas);
  padding: 0 8px;
  border-radius: 6px;
}
.archv .seg-sub {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--muted);
  background: var(--canvas);
  padding: 0 6px;
  border-radius: 6px;
}
.archv .edge-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 14;
}
.archv .edge-line {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
  opacity: 0.8;
  transition:
    opacity 0.2s,
    stroke 0.2s;
}
.archv .edge-label {
  font-family: var(--font-body);
  font-size: 11px;
  fill: var(--edge-label);
  paint-order: stroke;
  stroke: var(--canvas);
  stroke-width: 4px;
  stroke-linejoin: round;
  opacity: 0;
  transition: opacity 0.2s;
}
.archv .zoomed-in .edge-label {
  opacity: 0.9;
}
.archv .arrow {
  fill: var(--edge);
}
.archv .arrow.hi {
  fill: var(--accent);
}
.archv .edge.hi .edge-line {
  stroke: var(--accent);
  stroke-width: 3;
  opacity: 1;
}
.archv .edge.hi .edge-line {
  marker-end: url(#arrow-hi);
}
.archv .edge.hi .edge-label {
  opacity: 1;
  fill: var(--accent-ink);
  font-weight: 700;
}
.archv .has-open .edge:not(.hi) .edge-line {
  opacity: 0.12;
}
.archv .has-open .edge:not(.hi) .edge-label {
  opacity: 0;
}
.archv .node {
  transition: opacity 0.2s;
}
/* A node's foreignObject is 400px taller than its card, room for the card to
   expand. Only the card takes the pointer: otherwise a selected node, which is
   raised to the top, swallows clicks meant for the node drawn below it. */
.archv .node foreignObject {
  pointer-events: none;
}
.archv .node .card {
  pointer-events: auto;
}
.archv .node.dim {
  opacity: 0.35;
}
.archv .card {
  background: var(--card);
  color: var(--ink);
  border: 1.5px solid var(--card-line);
  border-radius: var(--card-radius);
  padding: 10px 12px 8px;
  box-shadow: var(--card-shadow);
  cursor: pointer;
  font-family: var(--font-body);
  transition:
    box-shadow 0.15s,
    transform 0.15s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.archv .card:hover {
  box-shadow: var(--card-shadow-hover);
  transform: translateY(-1px);
}
.archv .node.open .card {
  border-color: var(--accent);
  box-shadow: var(--card-shadow-open);
}
.archv .node.selected .card {
  border-color: var(--accent);
  box-shadow:
    0 0 0 2px var(--accent-soft, rgba(255, 210, 122, 0.35)),
    var(--card-shadow, none);
}
.archv .node.linked .card {
  border-color: var(--accent-soft);
}
.archv .card-head {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.archv .card-title {
  font-family: var(--font-display);
  font-weight: var(--display-weight);
  font-size: 16px;
  line-height: 1.15;
  color: var(--card-title);
  text-wrap: balance;
}
.archv .card-nick {
  font-size: 11.5px;
  color: var(--accent-ink);
  font-style: italic;
}
.archv .card-summary {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-2);
}
.archv .card-more {
  display: none;
  flex-direction: column;
  gap: 8px;
  border-top: 1px dashed var(--card-line);
  padding-top: 8px;
}
.archv .node.open .card-more {
  display: flex;
}
.archv .card-details {
  margin: 0;
  padding-left: 18px;
  font-size: 12.5px;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.archv .card-files {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.archv .card-files code {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--code-bg);
  color: var(--code-ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 6px;
}
.archv .card-hint {
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.archv .node.open .card-hint {
  display: none;
}
.archv .tone-sky {
  --seg-line: var(--t-sky);
  --seg-title: var(--t-sky-ink);
  --card-title: var(--t-sky-ink);
}
.archv .tone-slate {
  --seg-line: var(--t-slate);
  --seg-title: var(--t-slate-ink);
  --card-title: var(--t-slate-ink);
}
.archv .tone-teal {
  --seg-line: var(--t-teal);
  --seg-title: var(--t-teal-ink);
  --card-title: var(--t-teal-ink);
}
.archv .tone-moss {
  --seg-line: var(--t-moss);
  --seg-title: var(--t-moss-ink);
  --card-title: var(--t-moss-ink);
}
.archv .tone-gold {
  --seg-line: var(--t-gold);
  --seg-title: var(--t-gold-ink);
  --card-title: var(--t-gold-ink);
}
.archv .tone-copper {
  --seg-line: var(--t-copper);
  --seg-title: var(--t-copper-ink);
  --card-title: var(--t-copper-ink);
}
.archv .tone-lavender {
  --seg-line: var(--t-lavender);
  --seg-title: var(--t-lavender-ink);
  --card-title: var(--t-lavender-ink);
}
.archv .tone-rose {
  --seg-line: var(--t-rose);
  --seg-title: var(--t-rose-ink);
  --card-title: var(--t-rose-ink);
}
.archv .tone-stone {
  --seg-line: var(--t-stone);
  --seg-title: var(--t-stone-ink);
  --card-title: var(--t-stone-ink);
}
.archv .tone-ink {
  --seg-line: var(--t-ink);
  --seg-title: var(--t-ink-ink);
  --card-title: var(--t-ink-ink);
}
@media (prefers-reduced-motion: reduce) {
  .card,
  .node,
  .edge-line {
    transition: none;
  }
}
@media (max-width: 600px) {
  .archv .bar .status,
  .archv .legend {
    display: none;
  }
  .archv .bar input {
    min-width: 120px;
  }
}

/* Cafe: the dusk village square from the 3D scene. One deliberate dark world, no light variant. */
:root {
  --font-display: "Lilita One", "Nunito", sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --display-weight: 400;
  --bg: #0b1b26;
  --canvas: #0e2231;
  --bar: #10262f;
  --btn: #163440;
  --ink: #eef3ee;
  --ink-2: #c8d6d8;
  --muted: #8fb0b6;
  --title: #fff4dc;
  --line: #23485a;
  --accent: #ffd27a;
  --accent-ink: #ffe2a8;
  --accent-soft: #8a6b2a;
  --card: linear-gradient(180deg, #f8f1df, #efe4cb);
  --card-line: #3a2a1c;
  --card-radius: 14px;
  --card-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 8px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 #fff;
  --card-shadow-hover:
    0 4px 0 rgba(0, 0, 0, 0.35), 0 12px 26px rgba(0, 0, 0, 0.5), inset 0 1px 0 #fff;
  --card-shadow-open:
    0 4px 0 rgba(0, 0, 0, 0.35), 0 0 0 3px rgba(255, 210, 122, 0.35),
    0 0 28px rgba(255, 157, 61, 0.45), 0 18px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 #fff;
  --code-bg: #1c3f4d;
  --code-ink: #cfeaf3;
  --seg-fill: rgba(22, 52, 64, 0.35);
  --edge: #5f8a99;
  --edge-label: #a9c7cf;
  --t-sky: #37a3c9;
  --t-sky-ink: #1e5468;
  --t-slate: #7f95a3;
  --t-slate-ink: #3f4f5a;
  --t-teal: #2f8f9d;
  --t-teal-ink: #1b5960;
  --t-moss: #7fb069;
  --t-moss-ink: #3f6a30;
  --t-gold: #ffd27a;
  --t-gold-ink: #7a5310;
  --t-copper: #d28a5a;
  --t-copper-ink: #7b4520;
  --t-lavender: #b79bea;
  --t-lavender-ink: #5a4390;
  --t-rose: #e46c8a;
  --t-rose-ink: #8a3550;
  --t-stone: #a89a86;
  --t-stone-ink: #5a5044;
  --t-ink: #8fb0b6;
  --t-ink-ink: #2f4a52;
  color-scheme: dark;
}
.archv-page {
  background: radial-gradient(1400px 700px at 30% -10%, #163d52 0%, var(--bg) 55%);
}
.archv .bar {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.08),
    0 6px 20px rgba(0, 0, 0, 0.3);
}
.archv .bar .title {
  font-size: 24px;
  text-shadow:
    0 0 18px rgba(255, 210, 122, 0.45),
    0 2px 0 #3a2a10;
}
.archv .bar button {
  background: linear-gradient(180deg, #1c3f4d, #163440);
  border-color: #2f5d70;
  box-shadow:
    0 2px 0 #0a1820,
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  border-radius: 10px;
}
.archv .bar button:hover {
  border-color: var(--accent);
  filter: brightness(1.08);
}
.archv .archv-canvas {
  background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 28px 28px;
}
.archv .seg-box {
  stroke-dasharray: 12 10;
}
.archv .seg-name {
  color: var(--accent);
  text-shadow: 0 0 14px rgba(255, 210, 122, 0.3);
  font-size: 24px;
  letter-spacing: 0.02em;
}
.archv .seg-sub {
  color: var(--muted);
}
.archv .card {
  color: #1f2a2e;
}
.archv .card-title {
  color: var(--card-title);
}
.archv .card-summary {
  color: #3a4a50;
}
.archv .card-details {
  color: #2a383e;
}
.archv .card-nick {
  color: #8a4a26;
}
.archv .card-hint {
  color: #8a7a62;
}
.archv .card-more {
  border-top-color: #cbb994;
}
.archv .card-files code {
  background: #2b4d5c;
  color: #dff1f7;
  border-color: #1b3440;
}
.archv .node.linked .card {
  border-color: #b8601e;
}
.archv .edge.hi .edge-line {
  filter: drop-shadow(0 0 4px rgba(255, 210, 122, 0.8));
}
.archv .legend {
  color: var(--muted);
}

</style>
</head>
<body>
<div class="archv archv-page">
  <header class="bar">
    <h1 class="title">Stardust Cafe Floor Plan</h1>
    <span class="sub">Wander the square · scroll to zoom · tap a station to peek behind the counter</span>
    <span class="spacer"></span>
    <input id="search" list="search-list" placeholder="Find a station…" aria-label="Jump to a component" />
    <datalist id="search-list"></datalist>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <span class="zoom" id="zoom">100%</span>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-fit" type="button">Fit</button>
    <span class="status" id="status">Every station is a real module. Tap one; Esc steps back.</span>
  </header>
  <div class="legend"><span class="tone-sky"><i></i>Client</span><span class="tone-teal"><i></i>API server</span><span class="tone-moss"><i></i>Orchestration</span><span class="tone-gold"><i></i>Agent runtime</span><span class="tone-copper"><i></i>MCP gateway</span><span class="tone-lavender"><i></i>Models</span><span class="tone-rose"><i></i>Evals</span><span class="tone-stone"><i></i>Data</span><span class="tone-ink"><i></i>Protocol</span><span class="tone-slate"><i></i>External</span></div>
  <div id="canvas"></div>
</div>
<script>
/* Architecture model for Stardust Cafe. One source for both diagram treatments. */
const ARCH = {
  world: { w: 2620, h: 1580 },
  segments: [
    {
      id: 'client',
      title: 'Client',
      sub: 'apps/web (browser)',
      nick: 'The Storefront',
      x: 40,
      y: 40,
      w: 1220,
      h: 440,
      tone: 'sky',
    },
    {
      id: 'external',
      title: 'External model providers',
      sub: 'reached over HTTPS',
      nick: 'Out of Town',
      x: 1300,
      y: 40,
      w: 1280,
      h: 200,
      tone: 'slate',
    },
    {
      id: 'clients-ext',
      title: 'External callers',
      sub: 'MCP clients and the CLI',
      nick: 'Regulars at the Door',
      x: 1300,
      y: 270,
      w: 1280,
      h: 210,
      tone: 'slate',
    },
    {
      id: 'server',
      title: 'API server',
      sub: 'apps/server (Hono on Node)',
      nick: 'The Back Office',
      x: 40,
      y: 530,
      w: 640,
      h: 400,
      tone: 'teal',
    },
    {
      id: 'orch',
      title: 'Orchestration',
      sub: 'apps/server/src/orchestrator.ts',
      nick: 'The Floor',
      x: 720,
      y: 530,
      w: 660,
      h: 400,
      tone: 'moss',
    },
    {
      id: 'agents',
      title: 'Agent runtime',
      sub: 'packages/agents',
      nick: 'The Staff',
      x: 1420,
      y: 530,
      w: 560,
      h: 400,
      tone: 'gold',
    },
    {
      id: 'gateway',
      title: 'MCP gateway',
      sub: 'packages/mcp-gateway',
      nick: 'The Pass',
      x: 2020,
      y: 530,
      w: 560,
      h: 400,
      tone: 'copper',
    },
    {
      id: 'models',
      title: 'Models',
      sub: 'packages/models',
      nick: 'The Roster',
      x: 40,
      y: 990,
      w: 900,
      h: 300,
      tone: 'lavender',
    },
    {
      id: 'evals',
      title: 'Evals',
      sub: 'packages/evals',
      nick: "The Inspector's Desk",
      x: 980,
      y: 990,
      w: 860,
      h: 300,
      tone: 'rose',
    },
    {
      id: 'data',
      title: 'Data',
      sub: 'packages/db + Postgres',
      nick: 'The Cellar',
      x: 1880,
      y: 990,
      w: 700,
      h: 300,
      tone: 'stone',
    },
    {
      id: 'protocol',
      title: 'Protocol (shared contract)',
      sub: 'packages/protocol, imported by everything',
      nick: 'House Rules',
      x: 40,
      y: 1350,
      w: 2540,
      h: 190,
      tone: 'ink',
    },
  ],
  nodes: [
    // client
    {
      id: 'panels',
      seg: 'client',
      x: 70,
      y: 110,
      title: 'React panels',
      nick: 'the menu board',
      summary:
        'Run config (with the business domain), Cases (waterfalls), Queue, Inspector, Metrics, Log, playback controls; the Experiment and Decision bench pages.',
      details: [
        'Run config with per-role model specs, scenarios, staffing, chaos, budget and a pre-run cost estimate; the draft lives in App so the header, the empty stage and the Shift tab all start the same run.',
        'Playback controls carry their own help: two sentences per mode, expandable to the long form (playback/mode-docs.ts).',
        'The Log opens a nested inspector pane beside the trace instead of switching tabs; the side panel is resizable up to half the viewport (components/usePanelWidth.ts).',
        'Metrics has a Telemetry view: hand-rolled SVG charts (charts/) over the span aggregate: tool latency and reasoning latency per step as dot strips, cumulative cost, errors by layer and kind, one row per visit. Polls while the run is live.',
        'The Experiment page (experiment/) is a clickable pipeline diagram (the architecture engine in select mode) whose nodes open that layer’s controls: dataset editor, engine + manager, staff models, chaos, judge. Variants beside it each loop the dataset; results show per-variant metrics, an item x variant grid and overlaid telemetry.',
        'Cases tab renders one waterfall per golden case ("Case 3 · <title>") with beat percentages; the persona is data, not the label.',
        'Every themed word goes through lib/nomenclature.ts, which follows the active domain (the loaded run’s, else the draft’s, or the suite’s on the Experiment page): "agent 1 (support rep 2)", resolved/declined, beat labels.',
        'The Run tab has a Business domain picker and a Decision points section: triage routing and the action gate with its own model and threshold.',
        'The Decision bench page (bench/) runs the same labelled decisions (door, gate, judge) against up to five evaluation models and shows accuracy vs latency per decision point, a scores table and every decision a model got wrong.',
        'Inspector: linked views of a case (its full golden expectation, the expected tools per agent marked called / missing / unexpected, and what happened), a tool (description, scope, holders, input schema, every call in the run) an agent (persona with Read more, tool slice, model, latency, usage, tool trail), and a case’s judge verdict or orchestrator review (every answer, agreement with ground truth, model, cost, the brief it read). Drilling in opens the next view in the panel and moves the previous ones into columns to its left (InspectorTrail), folding the oldest into strips when the stage would get too narrow. Case pills are verdicts: green when the outcome matches the expectation, red with a red case header when it deviates.',
        'Metrics tab reads /api/runs/:id/metrics and compares recent shifts.',
      ],
      files: [
        'apps/web/src/App.tsx',
        'apps/web/src/components/*.tsx',
        'apps/web/src/components/run-draft.ts',
        'apps/web/src/playback/mode-docs.ts',
        'apps/web/src/components/TelemetryPanel.tsx',
        'apps/web/src/charts/*.tsx',
        'apps/web/src/experiment/*.tsx',
        'apps/web/src/bench/BenchPage.tsx',
        'apps/web/src/lib/nomenclature.ts',
      ],
    },
    {
      id: 'apiclient',
      seg: 'client',
      x: 360,
      y: 110,
      title: 'Harness client',
      nick: 'the runner',
      summary:
        'The HarnessClient interface the UI talks to; the Stardust server implements it over REST + SSE.',

/* Pannable, zoomable architecture canvas. Renders `options.data`; theme decides copy and chrome. */
/**
 * Mount the diagram into `container`. `options.controls` are optional toolbar elements
 * the caller renders (zoomIn, zoomOut, fit, zoom, status, search, searchList).
 * `options.onSelect(id | null)` fires whenever the selection changes; with
 * `options.expandOnClick === false` a click selects the node (highlighting its edges,
 * dimming the rest) without widening the card, which lets a host render the node's
 * controls elsewhere. Returns { destroy, fit, expand, select, setSummary }.
 */
function mountArchitecture(container, options) {
  const NS = 'http://www.w3.org/2000/svg'
  const XH = 'http://www.w3.org/1999/xhtml'
  const DEF_W = 250
  const DEF_H = 120
  const EXP_W = 470

  const opts = options || {}
  const controls = opts.controls || {}
  const useNick = !!opts.nicknames
  const expandOnClick = opts.expandOnClick !== false
  const onSelect = typeof opts.onSelect === 'function' ? opts.onSelect : null
  const data = opts.data
  const segById = Object.fromEntries(data.segments.map((s) => [s.id, s]))
  const nodeById = Object.fromEntries(data.nodes.map((n) => [n.id, n]))
  for (const n of data.nodes) {
    n.w = n.w || DEF_W
    n.h = n.h || DEF_H
  }

  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag)
    for (const k in attrs) e.setAttribute(k, attrs[k])
    if (parent) parent.appendChild(e)
    return e
  }
  const html = (tag, cls, text) => {
    const e = document.createElementNS(XH, tag)
    if (cls) e.className = cls
    if (text !== undefined) e.textContent = text
    return e
  }

  const root = container
  root.classList.add('archv-canvas')
  const svg = el(
    'svg',
    {
      class: 'archv-svg',
      tabindex: '0',
      role: 'application',
      'aria-label': 'Architecture diagram',
    },
    root,
  )
  const defs = el('defs', {}, svg)
  for (const [id, cls] of [
    ['arrow', 'arrow'],
    ['arrow-hi', 'arrow hi'],
  ]) {
    const m = el(
      'marker',
      {
        id,
        viewBox: '0 0 10 10',
        refX: '9',
        refY: '5',
        markerWidth: '8',
        markerHeight: '8',
        orient: 'auto-start-reverse',
      },
      defs,
    )
    el('path', { d: 'M0,0 L10,5 L0,10 z', class: cls }, m)
  }
  const world = el('g', { class: 'world' }, svg)
  const gSeg = el('g', { class: 'segments' }, world)
  const gEdge = el('g', { class: 'edges' }, world)
  const gNode = el('g', { class: 'nodes' }, world)

  // ---- segments
  for (const s of data.segments) {
    const g = el('g', { class: `seg tone-${s.tone}`, 'data-id': s.id }, gSeg)
    el('rect', { x: s.x, y: s.y, width: s.w, height: s.h, rx: 18, class: 'seg-box' }, g)
    const title = useNick ? s.nick : s.title
    const sub = useNick ? `${s.title} · ${s.sub}` : s.sub
    const fo = el('foreignObject', { x: s.x + 18, y: s.y - 22, width: s.w - 36, height: 60 }, g)
    const wrap = html('div', 'seg-title')
    const t = html('span', 'seg-name', title)
    const u = html('span', 'seg-sub', sub)
    wrap.appendChild(t)
    wrap.appendChild(u)
    fo.appendChild(wrap)
  }

  // ---- edges
  const center = (n) => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 })
  function anchors(a, b) {
    const ca = center(a)
    const cb = center(b)
    const dx = cb.x - ca.x
    const dy = cb.y - ca.y
    if (Math.abs(dx) * 0.8 > Math.abs(dy)) {
      const sx = dx > 0 ? a.x + a.w : a.x
      const tx = dx > 0 ? b.x : b.x + b.w
      return { s: { x: sx, y: ca.y }, t: { x: tx, y: cb.y }, horiz: true }
    }
    const sy = dy > 0 ? a.y + a.h : a.y
    const ty = dy > 0 ? b.y : b.y + b.h
    return { s: { x: ca.x, y: sy }, t: { x: cb.x, y: ty }, horiz: false }
  }
  function pathFor(a, b) {
    const { s, t, horiz } = anchors(a, b)
    const k = horiz
      ? Math.max(40, Math.abs(t.x - s.x) * 0.45)
      : Math.max(40, Math.abs(t.y - s.y) * 0.45)
    const c1 = horiz
      ? { x: s.x + Math.sign(t.x - s.x) * k, y: s.y }
      : { x: s.x, y: s.y + Math.sign(t.y - s.y) * k }
    const c2 = horiz
      ? { x: t.x - Math.sign(t.x - s.x) * k, y: t.y }
      : { x: t.x, y: t.y - Math.sign(t.y - s.y) * k }
    const mid = {
      x: (s.x + 3 * c1.x + 3 * c2.x + t.x) / 8,
      y: (s.y + 3 * c1.y + 3 * c2.y + t.y) / 8,
    }
    return { d: `M${s.x},${s.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${t.x},${t.y}`, mid }
  }
  const edgeEls = []
  for (const e of data.edges) {
    const a = nodeById[e.from]
    const b = nodeById[e.to]
    if (!a || !b) continue
    const g = el('g', { class: 'edge', 'data-from': e.from, 'data-to': e.to }, gEdge)
    const { d, mid } = pathFor(a, b)
    el('path', { d, class: 'edge-hit' }, g)
    const p = el('path', { d, class: 'edge-line', 'marker-end': 'url(#arrow)' }, g)
    if (e.label) {
      const t = el(
        'text',
        { x: mid.x, y: mid.y - 6, class: 'edge-label', 'text-anchor': 'middle' },
        g,
      )
      t.textContent = e.label
    }
    edgeEls.push({ g, p, e })
  }

  // ---- nodes
  const nodeEls = {}
  let expanded = null
  for (const n of data.nodes) {
    const seg = segById[n.seg]
    const g = el('g', { class: `node tone-${seg.tone}`, 'data-id': n.id }, gNode)
    const fo = el('foreignObject', { x: n.x, y: n.y, width: n.w, height: n.h + 400 }, g)
    const card = html('div', 'card')
    card.setAttribute('role', 'button')
    card.setAttribute('tabindex', '0')
    card.style.width = `${n.w}px`
    card.style.minHeight = `${n.h}px`
    const head = html('div', 'card-head')
    head.appendChild(html('div', 'card-title', useNick ? n.title : n.title))
    if (useNick && n.nick) head.appendChild(html('div', 'card-nick', n.nick))
    card.appendChild(head)
    card.appendChild(html('p', 'card-summary', n.summary))
    const more = html('div', 'card-more')
    if (n.details?.length) {
      const ul = html('ul', 'card-details')
      for (const d of n.details) ul.appendChild(html('li', '', d))
      more.appendChild(ul)
    }
    if (n.files?.length) {
      const files = html('div', 'card-files')
      for (const f of n.files) files.appendChild(html('code', '', f))
      more.appendChild(files)
    }
    const hint = html(
      'div',
      'card-hint',
      opts.hint || (useNick ? 'tap to peek behind the counter' : 'click to expand'),
    )
    card.appendChild(more)
    card.appendChild(hint)
    fo.appendChild(card)
    nodeEls[n.id] = { g, fo, card, n, summary: card.querySelector('.card-summary') }
    const toggle = (ev) => {
      ev.stopPropagation()
      expand(expanded === n.id ? null : n.id)
    }
    card.addEventListener('click', (ev) => {
      if (dragMoved) return
      toggle(ev)
    })
    card.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault()
        toggle(ev)
      }
    })
  }

  function expand(id) {
    if (expanded && nodeEls[expanded]) {
      const prev = nodeEls[expanded]
      prev.g.classList.remove('open', 'selected')
      prev.fo.setAttribute('width', prev.n.w)
      prev.card.style.width = `${prev.n.w}px`
    }
    const changed = expanded !== id
    expanded = id
    svg.classList.toggle('has-open', !!id)
    for (const { g, e } of edgeEls) g.classList.toggle('hi', !!id && (e.from === id || e.to === id))
    for (const k in nodeEls) {
      const isLinked =
        !!id &&
        data.edges.some((e) => (e.from === id && e.to === k) || (e.to === id && e.from === k))
      nodeEls[k].g.classList.toggle('linked', isLinked)
      nodeEls[k].g.classList.toggle('dim', !!id && k !== id && !isLinked)
    }
    if (!id) {
      if (changed && onSelect) onSelect(null)
      return
    }
    const cur = nodeEls[id]
    if (expandOnClick) {
      cur.g.classList.add('open')
      cur.fo.setAttribute('width', EXP_W)
      cur.card.style.width = `${EXP_W}px`
    } else cur.g.classList.add('selected')
    gNode.appendChild(cur.g) // on top
    const info = controls.status
    if (info) info.textContent = `${cur.n.title} · ${segById[cur.n.seg].title}`
    if (changed && onSelect) onSelect(id)
  }

  /** Replace a node's summary line in place (a host showing live choices on the cards). */
  function setSummary(id, text) {
    const cur = nodeEls[id]
    if (cur?.summary) cur.summary.textContent = text
  }

  // ---- pan & zoom
  const view = { x: 0, y: 0, k: 1 }
  let dragging = false
  let dragMoved = false
  let start = null
  const apply = () => {
    world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`)
    svg.classList.toggle('zoomed-in', view.k >= 0.7)
    const z = controls.zoom
    if (z) z.textContent = `${Math.round(view.k * 100)}%`
  }
  function fitView() {
    const r = root.getBoundingClientRect()
    const pad = 40
    const k = Math.min((r.width - pad * 2) / data.world.w, (r.height - pad * 2) / data.world.h)
    view.k = Math.max(0.12, Math.min(2.5, k))
    view.x = (r.width - data.world.w * view.k) / 2
    view.y = (r.height - data.world.h * view.k) / 2
    apply()
  }
  function zoomAt(factor, cx, cy) {
    const nk = Math.max(0.12, Math.min(3, view.k * factor))
    const f = nk / view.k
    view.x = cx - (cx - view.x) * f
    view.y = cy - (cy - view.y) * f
    view.k = nk
    apply()
  }
  svg.addEventListener(
    'wheel',
    (ev) => {
      ev.preventDefault()
      const r = root.getBoundingClientRect()
      const factor = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015))
      zoomAt(factor, ev.clientX - r.left, ev.clientY - r.top)
    },
    { passive: false },
  )
  svg.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return
    dragging = true
    dragMoved = false
    start = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, id: ev.pointerId }
  })
  svg.addEventListener('pointermove', (ev) => {
    if (!dragging || !start) return
    const dx = ev.clientX - start.x
    const dy = ev.clientY - start.y
    if (!dragMoved && Math.hypot(dx, dy) > 4) {
      dragMoved = true
      svg.classList.add('grabbing')
      // capture only once a real drag starts, so plain clicks still reach the cards
      try {
        svg.setPointerCapture(start.id)
      } catch {
        /* ignore */
      }
    }
    if (dragMoved) {
      view.x = start.vx + dx
      view.y = start.vy + dy
      apply()
    }
  })
  const endDrag = (ev) => {
    if (!dragging) return
    dragging = false
    svg.classList.remove('grabbing')
    if (!dragMoved && ev.target === svg) expand(null)
    setTimeout(() => {
      dragMoved = false
    }, 0)
  }
  svg.addEventListener('pointerup', endDrag)
  svg.addEventListener('pointercancel', endDrag)
  svg.addEventListener('click', (ev) => {
    if (ev.target === svg && !dragMoved) expand(null)
  })
  // pinch on touch devices
  const touches = new Map()
  let pinchStart = null
  svg.addEventListener(
    'touchstart',
    (ev) => {
      for (const t of ev.changedTouches) touches.set(t.identifier, t)
      if (ev.touches.length === 2) {
        const [a, b] = [ev.touches[0], ev.touches[1]]
        pinchStart = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), k: view.k }
      }
    },
    { passive: true },
  )
  svg.addEventListener(
    'touchmove',
    (ev) => {
      if (ev.touches.length === 2 && pinchStart) {
        const [a, b] = [ev.touches[0], ev.touches[1]]
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)
        const r = root.getBoundingClientRect()
        const cx = (a.clientX + b.clientX) / 2 - r.left
        const cy = (a.clientY + b.clientY) / 2 - r.top
        zoomAt((pinchStart.k * (d / pinchStart.d)) / view.k, cx, cy)
      }
    },
    { passive: true },
  )
  svg.addEventListener('touchend', () => {
    if (touches.size < 2) pinchStart = null
    touches.clear()
  })

  controls.zoomIn?.addEventListener('click', () => {
    const r = root.getBoundingClientRect()
    zoomAt(1.25, r.width / 2, r.height / 2)
  })
  controls.zoomOut?.addEventListener('click', () => {
    const r = root.getBoundingClientRect()
    zoomAt(0.8, r.width / 2, r.height / 2)
  })
  controls.fit?.addEventListener('click', fitView)
  const onKey = (ev) => {
    if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return
    const r = root.getBoundingClientRect()
    if (ev.key === '+' || ev.key === '=') zoomAt(1.25, r.width / 2, r.height / 2)
    else if (ev.key === '-') zoomAt(0.8, r.width / 2, r.height / 2)
    else if (ev.key === '0') fitView()
    else if (ev.key === 'Escape') expand(null)
  }
  window.addEventListener('keydown', onKey)
  const ro = new ResizeObserver(() => {
    if (!userMoved) fitView()
  })
  let userMoved = false
  svg.addEventListener(
    'pointerdown',
    () => {
      userMoved = true
    },
    { once: true },
  )
  ro.observe(root)

  // ---- search / jump
  const search = controls.search
  if (search) {
    const list = controls.searchList
    if (list)
      for (const n of data.nodes)
        list.appendChild(Object.assign(html('option'), { value: n.title }))
    search.addEventListener('change', () => {
      const q = search.value.trim().toLowerCase()
      const n =
        data.nodes.find((x) => x.title.toLowerCase() === q) ||
        data.nodes.find((x) => x.title.toLowerCase().includes(q))
      if (!n) return
      const r = root.getBoundingClientRect()
      view.k = Math.max(view.k, 0.9)
      view.x = r.width / 2 - (n.x + n.w / 2) * view.k
      view.y = r.height / 2 - (n.y + n.h / 2) * view.k
      userMoved = true
      apply()
      expand(n.id)
    })
  }

  fitView()
  if (opts.initialSelected) expand(opts.initialSelected)
  return {
    fit: fitView,
    expand,
    select: expand,
    setSummary,
    destroy() {
      ro.disconnect()
      window.removeEventListener('keydown', onKey)
      svg.remove()
    },
  }
}

mountArchitecture(document.getElementById('canvas'), {
  data: ARCH,
  nicknames: true,
  controls: {
    zoomIn: document.getElementById('zoom-in'),
    zoomOut: document.getElementById('zoom-out'),
    fit: document.getElementById('zoom-fit'),
    zoom: document.getElementById('zoom'),
    status: document.getElementById('status'),
    search: document.getElementById('search'),
    searchList: document.getElementById('search-list'),
  },
})
</script>

</body>
</html>
